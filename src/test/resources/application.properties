# Propriedades de teste para serviço de notificação (H2 em memória)
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Evitar a autoconfiguração de segurança nos testes (se necessário)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration,org.springframework.boot.autoconfigure.security.servlet.ManagementWebSecurityAutoConfiguration

# Actuator / logging
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized
logging.level.org.springdoc=DEBUG
logging.level.org.hibernate=ERROR

# H2 Fonte de dados em memória H2 para testes
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Também exponha as propriedades JDBC de Jakarta para que o Hibernate possa determinar o dialeto a partir dos metadados JDBC.
jakarta.persistence.jdbc.url=${spring.datasource.url}
jakarta.persistence.jdbc.driver=org.h2.Driver
jakarta.persistence.jdbc.user=${spring.datasource.username}
jakarta.persistence.jdbc.password=${spring.datasource.password}

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
# Explicit dialect to avoid detection issues
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Opcional: reduzir o nível de detalhamento dos registros durante os testes.
logging.level.org.springframework=INFO
