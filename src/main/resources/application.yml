spring:
  application:
    name: audit-service
  datasource:
    url: jdbc:postgresql://localhost:5432/auditdb
    username: audit
    password: auditpass
    driver-class-name: org.postgresql.Driver
  jpa:
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

kafka:
  bootstrap-servers: localhost:9092
  consumer:
    group-id: audit-service-group
    auto-offset-reset: earliest

logging:
  level:
    root: INFO

server:
  port: 8081

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html